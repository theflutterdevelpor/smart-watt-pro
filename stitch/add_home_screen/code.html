<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1326;
            margin: 0;
            color: #dae2fd;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(29, 90, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(163, 215, 62, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "inverse-primary": "#004cec",
                "error-container": "#93000a",
                "tertiary-fixed-dim": "#c6c6c7",
                "surface-container-highest": "#2d3449",
                "primary-container": "#1d5aff",
                "surface-container-lowest": "#060e20",
                "on-surface": "#dae2fd",
                "on-primary-fixed-variant": "#0038b6",
                "surface-container-low": "#131b2e",
                "tertiary-fixed": "#e2e2e2",
                "tertiary-container": "#6a6c6c",
                "on-secondary-fixed-variant": "#364e00",
                "background": "#0b1326",
                "on-secondary": "#243600",
                "outline-variant": "#434656",
                "on-background": "#dae2fd",
                "outline": "#8d90a2",
                "on-secondary-container": "#243600",
                "primary": "#b7c4ff",
                "on-secondary-fixed": "#131f00",
                "on-primary": "#002682",
                "on-primary-fixed": "#001552",
                "on-error-container": "#ffdad6",
                "on-tertiary": "#2f3131",
                "surface-container-high": "#222a3d",
                "on-error": "#690005",
                "on-tertiary-fixed-variant": "#454747",
                "on-tertiary-fixed": "#1a1c1c",
                "inverse-surface": "#dae2fd",
                "surface": "#0b1326",
                "primary-fixed": "#dce1ff",
                "inverse-on-surface": "#283044",
                "primary-fixed-dim": "#b7c4ff",
                "on-surface-variant": "#c3c5d9",
                "secondary-fixed-dim": "#a3d73e",
                "surface-dim": "#0b1326",
                "secondary-fixed": "#bef458",
                "surface-variant": "#2d3449",
                "tertiary": "#c6c6c7",
                "surface-container": "#171f33",
                "surface-bright": "#31394d",
                "secondary": "#a3d73e",
                "on-primary-container": "#ebecff",
                "secondary-container": "#77a700",
                "error": "#ffb4ab",
                "surface-tint": "#b7c4ff",
                "on-tertiary-container": "#eeeeee"
            },
            "borderRadius": {
                "DEFAULT": "1rem",
                "lg": "2rem",
                "xl": "3rem",
                "full": "9999px"
            },
            "spacing": {
                "gutter": "24px",
                "lg": "40px",
                "sm": "12px",
                "base": "8px",
                "xl": "64px",
                "md": "24px",
                "margin": "32px",
                "xs": "4px"
            },
            "fontFamily": {
                "label-sm": ["Plus Jakarta Sans"],
                "label-md": ["Plus Jakarta Sans"],
                "headline-lg": ["Plus Jakarta Sans"],
                "body-lg": ["Plus Jakarta Sans"],
                "body-md": ["Plus Jakarta Sans"],
                "headline-md": ["Plus Jakarta Sans"],
                "display-lg": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                "label-sm": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "700"}],
                "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600"}],
                "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-32">
<!-- Top AppBar -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-6 py-3 bg-slate-900/65 backdrop-blur-[20px] rounded-full mt-4 mx-4 border border-white/15 shadow-[0_8px_32px_0_rgba(29,90,255,0.2)]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border border-white/20">
<img alt="Profile" class="w-full h-full object-cover" data-alt="A professional high-resolution headshot of a modern technologist against a dark, softly lit background. The lighting is dramatic and cinematic, with cool blue rim highlights reflecting a tech-focused environment. The overall aesthetic is clean, premium, and fits perfectly within a high-end energy management dashboard." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUTdZiq9Bq342G2RAMJRn-ZEUSf1enUH5nxB4CaTV6G_C09H6NPmw-LQtAzzIZtDsJkb-lAzDgbXLjeLaGbGHuXUOSUlQdp5oT9ExnqpxEQUgWvcXB7qj11A-F40wU7AOXakZGvunmFtgJwqsm5GdSUhTzEMk4Zz4czCndrEj7JicbDnEnfFQjpqLL5fk7IuErV_ioznUM1-VsG6W8aRwVuA5Yqftlm0vECg86-Wa1mVDSYWNsOXrCJ0zQjXCakxuvMzgnLkPQTr0"/>
</div>
<span class="text-blue-500 font-black text-xl italic font-['Plus_Jakarta_Sans']">Energy Suite</span>
</div>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-white/10 transition-all duration-300 active:scale-95 text-blue-500">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
</button>
</div>
</header>
<main class="pt-32 px-gutter max-w-4xl mx-auto">
<!-- Header Section -->
<div class="mb-lg">
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">Register Property</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Provide the installation details for your new smart energy hub.</p>
</div>
<!-- Form Section -->
<div class="glass-card bg-slate-900/65 rounded-lg p-md md:p-margin shadow-[0_8px_32px_0_rgba(29,90,255,0.1)]">
<form class="space-y-md">
<!-- Row 1: Name and Type -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block px-1">Home Name</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-lg px-4 py-3 text-on-surface placeholder:text-outline/50 focus:outline-none focus:border-primary transition-all duration-300 font-body-md text-body-md glass-card" placeholder="e.g. Skyline Residence" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary" data-icon="home">home</span>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block px-1">Property Type</label>
<select class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary transition-all duration-300 font-body-md text-body-md glass-card appearance-none">
<option value="house">Detached House</option>
<option value="apartment">Apartment / Condo</option>
<option value="office">Office Space</option>
<option value="industrial">Industrial Facility</option>
</select>
</div>
</div>
<!-- Row 2: Address -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block px-1">Street Address</label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-lg px-4 py-3 text-on-surface placeholder:text-outline/50 focus:outline-none focus:border-primary transition-all duration-300 font-body-md text-body-md glass-card" placeholder="Enter physical address" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary" data-icon="streetview">streetview</span>
</div>
</div>
<!-- Row 3: City, Province -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block px-1">City</label>
<input class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-lg px-4 py-3 text-on-surface placeholder:text-outline/50 focus:outline-none focus:border-primary transition-all duration-300 font-body-md text-body-md glass-card" placeholder="City" type="text"/>
</div>
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block px-1">Province / State</label>
<input class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-lg px-4 py-3 text-on-surface placeholder:text-outline/50 focus:outline-none focus:border-primary transition-all duration-300 font-body-md text-body-md glass-card" placeholder="State/Province" type="text"/>
</div>
</div>
<!-- Row 4: Country -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block px-1">Country</label>
<input class="w-full bg-surface-container-lowest/50 border border-white/10 rounded-lg px-4 py-3 text-on-surface placeholder:text-outline/50 focus:outline-none focus:border-primary transition-all duration-300 font-body-md text-body-md glass-card" placeholder="Select Country" type="text"/>
</div>
<!-- Row 5: Map Selector -->
<div class="space-y-sm pt-4">
<div class="flex justify-between items-end mb-2 px-1">
<label class="font-label-md text-label-md text-on-surface">Geofence Pin</label>
<span class="font-label-sm text-label-sm text-primary">Precise Location Enabled</span>
</div>
<div class="relative w-full h-64 rounded-lg overflow-hidden border border-white/15 glass-card">
<img class="w-full h-full object-cover grayscale opacity-60" data-alt="A dark-themed satellite map view of a modern urban city grid at night. The map shows glowing blue arterial roads and subtle green park areas, reflecting the energy suite's brand colors. In the center, a vibrant electric blue map pin icon pulses with a soft glow, indicating a precise selected location." data-location="Berlin" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2i4qNKlyKZVESOcF0UgI43fDqZ1yiHbKPxaMZHPXzbWv_S-_K1IdAVIWgiSXINbPKwNazmPuISxqzZ7yEUX7SVisRT0A7rWbD0nZeA9O9Gr0ROA8xEMmA1goo-Rw2Q2lv1IGGbZouu4QxQ8wFap7ju7_bGesdWKgInsczB35rPcwBw6icOXjzASVedesgjw6ZF2UBX-RCTQkPMufhxWQex0nzupxksB0g9L11G8zuUxbVcPC5qeuKE_CSfKEyFaQna-sZEzkQXKM"/>
<!-- Pin Overlay -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative">
<span class="material-symbols-outlined text-secondary text-5xl drop-shadow-[0_0_10px_rgba(163,215,62,0.8)]" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-4 h-1 bg-black/40 blur-[2px] rounded-full"></div>
</div>
</div>
<!-- Map Controls -->
<div class="absolute bottom-4 right-4 flex flex-col gap-2">
<button class="w-10 h-10 glass-card bg-slate-900/80 rounded-lg flex items-center justify-center text-on-surface hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<button class="w-10 h-10 glass-card bg-slate-900/80 rounded-lg flex items-center justify-center text-on-surface hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-lg">
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-full font-label-md text-label-md uppercase tracking-widest shadow-[0_8px_24px_rgba(29,90,255,0.4)] hover:shadow-[0_12px_32px_rgba(29,90,255,0.6)] hover:brightness-110 active:scale-[0.98] transition-all duration-300" type="button">
                        Save Installation Details
                    </button>
</div>
</form>
</div>
</main>
<!-- Bottom NavBar -->
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center h-20 px-2 pb-safe bg-slate-900/65 backdrop-blur-[20px] rounded-full mb-6 mx-6 border border-white/15 shadow-[0_20px_50px_rgba(29,90,255,0.3)]">
<div class="flex flex-col items-center justify-center bg-blue-500/20 text-blue-400 rounded-full px-4 py-2 shadow-[0_0_15px_rgba(29,90,255,0.4)]">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-['Plus_Jakarta_Sans'] font-medium text-[10px] uppercase tracking-widest">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-blue-300 transition-colors duration-300 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="bolt">bolt</span>
<span class="font-['Plus_Jakarta_Sans'] font-medium text-[10px] uppercase tracking-widest">Meters</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-blue-300 transition-colors duration-300 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-['Plus_Jakarta_Sans'] font-medium text-[10px] uppercase tracking-widest">Stats</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-blue-300 transition-colors duration-300 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="font-['Plus_Jakarta_Sans'] font-medium text-[10px] uppercase tracking-widest">Alerts</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-blue-300 transition-colors duration-300 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Plus_Jakarta_Sans'] font-medium text-[10px] uppercase tracking-widest">Settings</span>
</div>
</nav>
</body></html>

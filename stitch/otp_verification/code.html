            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .otp-input:focus {

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="min-h-screen flex items-center justify-center p-gutter">
<!-- Hero Background Visual (Supressed Shelves for Transactional Flow) -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute -top-[10%] -right-[5%] w-[600px] h-[600px] bg-primary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -left-[5%] w-[500px] h-[500px] bg-secondary-container/10 rounded-full blur-[100px]"></div>
</div>
<!-- Main Verification Canvas -->
<main class="relative z-10 w-full max-w-xl">
<div class="glass-card bg-slate-900/65 rounded-lg p-lg shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
<!-- Close/Back Action (Transactional logic) -->
<div class="flex justify-start mb-base">
<button class="text-on-surface-variant hover:text-primary transition-colors duration-300 flex items-center gap-base">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span class="font-label-md text-label-md">Back to Login</span>
</button>
</div>
<!-- Header Section -->
<header class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary-container/20 mb-md border border-white/10 shadow-[0_0_30px_rgba(29,90,255,0.2)]">
<span class="material-symbols-outlined text-[40px] text-primary" data-icon="lock_person">lock_person</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Verify Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant px-md">
                    We've sent a 6-digit verification code to your registered email address <span class="text-primary font-semibold">a***e@energy-suite.com</span>
</p>
</header>
<!-- OTP Input Grid -->
<form action="#" class="space-y-xl">
<div class="flex justify-between gap-base md:gap-md">
<input class="otp-input w-full aspect-square md:w-16 md:h-20 text-center font-display-lg text-display-lg bg-surface-container-low text-on-surface border-white/10 rounded-lg glass-card focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300" maxlength="1" placeholder="•" type="text"/>
<input class="otp-input w-full aspect-square md:w-16 md:h-20 text-center font-display-lg text-display-lg bg-surface-container-low text-on-surface border-white/10 rounded-lg glass-card focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300" maxlength="1" placeholder="•" type="text"/>
<input class="otp-input w-full aspect-square md:w-16 md:h-20 text-center font-display-lg text-display-lg bg-surface-container-low text-on-surface border-white/10 rounded-lg glass-card focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300" maxlength="1" placeholder="•" type="text"/>
<input class="otp-input w-full aspect-square md:w-16 md:h-20 text-center font-display-lg text-display-lg bg-surface-container-low text-on-surface border-white/10 rounded-lg glass-card focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300" maxlength="1" placeholder="•" type="text"/>
<input class="otp-input w-full aspect-square md:w-16 md:h-20 text-center font-display-lg text-display-lg bg-surface-container-low text-on-surface border-white/10 rounded-lg glass-card focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300" maxlength="1" placeholder="•" type="text"/>
<input class="otp-input w-full aspect-square md:w-16 md:h-20 text-center font-display-lg text-display-lg bg-surface-container-low text-on-surface border-white/10 rounded-lg glass-card focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300" maxlength="1" placeholder="•" type="text"/>
</div>
<!-- Timer & Actions -->
<div class="flex flex-col items-center gap-md">
<div class="flex items-center gap-sm font-label-md text-label-md">
<span class="text-on-surface-variant">Didn't receive the code?</span>
<button class="text-secondary font-bold hover:underline transition-all disabled:opacity-50 disabled:cursor-not-allowed" type="button">Resend</button>
</div>
<div class="inline-flex items-center gap-xs px-md py-xs rounded-full bg-surface-container-highest/50 border border-white/5">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="timer">timer</span>
<span class="font-label-sm text-label-sm text-primary">02:59</span>
</div>
</div>
<!-- Main Action Button -->
<button class="group relative w-full h-14 bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-lg overflow-hidden shadow-[0_8px_32px_0_rgba(29,90,255,0.4)] active:scale-95 transition-all duration-200" type="submit">
<div class="absolute inset-0 bg-white/10 group-hover:opacity-100 opacity-0 transition-opacity"></div>
<div class="flex items-center justify-center gap-sm">
<span>Verify</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</form>
<!-- Decorative Trust Badges -->
<footer class="mt-xl pt-lg border-t border-white/10 flex flex-wrap justify-center gap-md opacity-60">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" data-icon="verified_user">verified_user</span>
<span class="font-label-sm text-label-sm">Secure Verification</span>
</div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" data-icon="encrypted">encrypted</span>
<span class="font-label-sm text-label-sm">256-bit Encryption</span>
</div>
</footer>
</div>
<!-- Optional Decorative Element -->
<div class="mt-md text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant tracking-widest uppercase">
                Energy Suite Security Layer
            </p>
</div>
</main>
<!-- Background Atmospheric Imagery -->
<div class="fixed inset-0 z-[-1] opacity-20">
<img class="w-full h-full object-cover grayscale" data-alt="A high-tech digital security landscape with glowing circuit board patterns and flowing data streams in deep blue and neon green tones. The atmosphere is cinematic and high-end, representing advanced cybersecurity and energetic data management. Soft focus highlights create a sense of depth and atmospheric perspective across a vast technological grid." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7nu-h8j05Lj2z3H1Wp0_HmBlGrXbltnKeM75zsXHgM0J67M2MG8kuEJ_SNAlqXAMVKstGaY24Sy5_QX6K9JwVrspzQjCgXDNl4AbMQP6V4qs7VYZuaiYumQijK-FbOB3C1VkjIWqzFx4q856mdUm7l_fT4u7msqwsLTlab6RUfkjNOERU0Sxj8Ud-PiAy2DB7v_xHlmx4Ky_5DeYZA45GkU_Rg_QrHrHklmdWDopeV93ulG_w8UawZWGx8bGZWf-zdh6MZ8_9060"/>
</div>
</body></html>

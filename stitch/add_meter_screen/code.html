<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1326;
            background-image: 
                radial-gradient(at 0% 0%, rgba(29, 90, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(163, 215, 62, 0.1) 0px, transparent 50%);
            min-height: 100vh;
        }
        .glass-card {
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input {
            background: rgba(6, 14, 32, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            border-color: #1d5aff;
            box-shadow: 0 0 15px rgba(29, 90, 255, 0.3);
            outline: none;
        }
    </style>

                        "on-background": "#dae2fd",

                        "on-secondary-container": "#243600",
                        "primary": "#b7c4ff",

                        "on-primary": "#002682",
                        "on-primary-fixed": "#001552",

                        "on-tertiary": "#2f3131",
                        "surface-container-high": "#222a3d",
                        "on-error": "#690005",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-tertiary-fixed": "#1a1c1c",

                        "surface": "#0b1326",
                        "primary-fixed": "#dce1ff",
                        "inverse-on-surface": "#283044",
                        "primary-fixed-dim": "#b7c4ff",

                        "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600"}],

                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-6 py-3 bg-slate-900/65 backdrop-blur-[20px] rounded-full mt-4 mx-4 border border-white/15 shadow-[0_8px_32px_0_rgba(29,90,255,0.2)]">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border border-primary/30">
<img alt="User Profile Avatar" class="w-full h-full object-cover" data-alt="A professional close-up portrait of a young tech executive with a clean-cut look, set against a blurred office background with cool blue lighting. The image quality is high-definition, reflecting a modern and premium corporate aesthetic with soft, cinematic lighting that highlights facial features." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDssXCmODW37RMdorAduomEOsckkBc8Hr02kT-r8u5ppc386eqLX3O2aC5e-18r_XrExnWqJAZfsI56s3gTKgpg1SzumgybA1E98Duvort7TdbZtgocMipEGDNuvMeVatJ1HVB2qeNPGp4RQpi34XhWNmK0ovkTXPO4vmXPOQtCQrg9cGtsbECY24oNFIEtLfIh1yzq8Ndbr-e5oVDlNiMddBTwzbdjWt-2-Yagva651Mv4BgE9pLbMgaUKP5tqvf7RgvvrZzc0fHw"/>
</div>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight text-on-surface">Energy Suite</h1>
</div>
<div class="flex items-center gap-2">
<div class="text-blue-500 font-black text-xl italic px-4">ES</div>
<button class="p-2 rounded-full hover:bg-white/10 transition-all duration-300 text-slate-400 active:scale-95">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-32 px-6 max-w-2xl mx-auto">
<!-- Header Section -->
<div class="mb-10 text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Add Smart Meter</h2>
<p class="font-body-md text-body-md text-outline">Configure your hardware for real-time energy monitoring</p>
</div>
<!-- Form Container -->
<div class="glass-card bg-slate-900/65 rounded-lg p-margin space-y-8 shadow-[0_20px_50px_rgba(29,90,255,0.1)]">
<!-- Meter Identity -->
<div class="space-y-6">
<div class="space-y-2">
<label class="font-label-md text-label-md text-primary ml-1">Meter Name</label>
<input class="glass-input w-full px-4 py-4 rounded-xl text-on-surface placeholder:text-outline/50 font-body-md" placeholder="e.g. Main Panel A" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-primary ml-1">Hardware ID</label>
<div class="relative">
<input class="glass-input w-full px-4 py-4 rounded-xl text-on-surface placeholder:text-outline/50 font-body-md" placeholder="SM-XXXX-XXXX-XXXX" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline/40">qr_code_scanner</span>
</div>
</div>
</div>
<!-- Phase Type Segmented Control -->
<div class="space-y-3">
<label class="font-label-md text-label-md text-primary ml-1">Phase Configuration</label>
<div class="grid grid-cols-2 gap-2 bg-surface-container-low p-1.5 rounded-full border border-white/5">
<button class="flex items-center justify-center gap-2 py-3 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 shadow-[0_0_15px_rgba(29,90,255,0.2)] transition-all duration-300">
<span class="material-symbols-outlined text-[18px]">looks_one</span>
<span class="font-label-md text-label-md uppercase tracking-wider">Single Phase</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 rounded-full text-slate-400 hover:text-white transition-all duration-300">
<span class="material-symbols-outlined text-[18px]">looks_3</span>
<span class="font-label-md text-label-md uppercase tracking-wider">Three Phase</span>
</button>
</div>
</div>
<!-- Dropdowns Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">
<label class="font-label-md text-label-md text-primary ml-1">Meter Role</label>
<div class="relative">
<select class="glass-input w-full px-4 py-4 rounded-xl text-on-surface font-body-md appearance-none">
<option>Main Incomer</option>
<option>Sub-Meter</option>
<option>Renewable Source</option>
<option>Critical Load</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline/40 pointer-events-none">expand_more</span>
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md text-primary ml-1">Area Assignment</label>
<div class="relative">
<select class="glass-input w-full px-4 py-4 rounded-xl text-on-surface font-body-md appearance-none">
<option>Production Floor</option>
<option>Office Block</option>
<option>Server Room</option>
<option>External Lighting</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline/40 pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-6 flex flex-col gap-4">
<button class="w-full py-5 bg-primary-container text-on-primary-container font-label-md text-label-md uppercase tracking-[2px] rounded-full shadow-[0_8px_32px_rgba(29,90,255,0.4)] hover:brightness-110 active:scale-[0.98] transition-all duration-200">
                    Register Smart Meter
                </button>
<button class="w-full py-4 bg-transparent text-outline font-label-md text-label-md uppercase tracking-[2px] rounded-full border border-white/10 hover:bg-white/5 transition-all duration-300">
                    Cancel Registration
                </button>
</div>
</div>
<!-- Visual Context -->
<div class="mt-12 glass-card bg-slate-900/40 rounded-lg p-6 flex items-center gap-6 border-dashed">
<div class="w-24 h-24 rounded-2xl overflow-hidden flex-shrink-0">
<img alt="Smart Meter Tech" class="w-full h-full object-cover grayscale opacity-60" data-alt="A high-tech industrial electrical panel showing complex wiring and digital smart meter displays illuminated with neon blue status lights. The composition is a sharp close-up with shallow depth of field, emphasizing the intricate engineering and modern energy management hardware. The lighting is moody and dark, accented by electric blue glows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCeYc9DN-7XRLg6KS0H7H8r8gMiCwAW0J5m9i8m6vV8EBpnHkSjKPvLoC49sLTy2cAnQr3nheJcjUc3lMiepA_-JBBv51uxcCyNY6aSg-tX_J00JW0K1lQTJiYeuR9xCDcgRFRFt3ErUE6CTesWSHRSudTTjgVQn4oA6NqPWbG8aQfv1BNuqjDPzPELNchUzo_ankEtrD2AylgAdXfPjsunnMhIXu0ZelYK-WmOQiHWpFG2-xjCQ4RIOxp_JOfGw46jwGahYkyXpSE"/>
</div>
<div>
<h4 class="font-headline-md text-label-md text-secondary">Automatic Discovery</h4>
<p class="font-body-md text-label-sm text-outline mt-1">Our gateway automatically detects most units within 30 meters. Ensure your device is in pairing mode.</p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center h-20 px-2 pb-safe bg-slate-900/65 backdrop-blur-[20px] rounded-full mb-6 mx-6 border border-white/15 shadow-[0_20px_50px_rgba(29,90,255,0.3)]">
<button class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-blue-300 transition-colors duration-300 active:scale-90">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-['Plus_Jakarta_Sans'] font-medium text-[10px] uppercase tracking-widest mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-blue-500/20 text-blue-400 rounded-full px-4 py-2 shadow-[0_0_15px_rgba(29,90,255,0.4)] active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="bolt">bolt</span>
<span class="font-['Plus_Jakarta_Sans'] font-medium text-[10px] uppercase tracking-widest mt-1">Meters</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-blue-300 transition-colors duration-300 active:scale-90">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-['Plus_Jakarta_Sans'] font-medium text-[10px] uppercase tracking-widest mt-1">Stats</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-blue-300 transition-colors duration-300 active:scale-90">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="font-['Plus_Jakarta_Sans'] font-medium text-[10px] uppercase tracking-widest mt-1">Alerts</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 px-4 py-2 hover:text-blue-300 transition-colors duration-300 active:scale-90">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Plus_Jakarta_Sans'] font-medium text-[10px] uppercase tracking-widest mt-1">Settings</span>
</button>
</nav>
</body></html>

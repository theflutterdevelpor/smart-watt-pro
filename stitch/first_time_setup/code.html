<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-gutter bg-mesh relative overflow-hidden">
<!-- Background Atmospheric Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[30%] h-[30%] bg-secondary/5 blur-[100px] rounded-full"></div>
<main class="relative z-10 w-full max-w-4xl">
<div class="grid lg:grid-cols-12 gap-8 items-center">
<!-- Branding Section -->
<div class="lg:col-span-5 flex flex-col items-start gap-md">
<div class="flex items-center gap-base">
<span class="text-blue-500 font-black text-3xl italic tracking-tighter">Energy Suite</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface leading-tight">
                    Powering your <span class="text-primary">smart</span> habitat.
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm">
                    Connect your smart meters and solar arrays to begin monitoring your ecosystem's efficiency in real-time.
                </p>
</div>
<!-- Setup Card Container -->
<div class="lg:col-span-7">
<div class="bg-slate-900/65 backdrop-blur-[20px] rounded-lg p-xl border border-white/15 shadow-[0_20px_50px_rgba(29,90,255,0.2)] glass-glow flex flex-col items-center text-center">
<!-- Luminous Icon -->
<div class="relative mb-md">
<div class="absolute inset-0 bg-primary/20 blur-xl rounded-full scale-150"></div>
<div class="relative w-24 h-24 rounded-full bg-surface-container border border-white/20 flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="home" style="font-variation-settings: 'FILL' 0, 'wght' 200;">home</span>
</div>
</div>
<!-- Text Content -->
<h2 class="font-headline-lg text-headline-lg mb-sm text-on-surface">Set Up Your First Home</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg max-w-md">
                        We couldn't find any connected properties. Let's start by defining your primary residence to unlock the dashboard.
                    </p>
<!-- Primary Action Button -->
<button class="w-full sm:w-auto bg-primary-container hover:bg-primary-container/80 text-on-primary-container font-label-md text-label-md px-xl py-md rounded-full shadow-[0_0_20px_rgba(29,90,255,0.4)] transition-all duration-300 active:scale-95 flex items-center justify-center gap-sm group">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
                        Add Home
                    </button>
<!-- Secondary Option -->
<button class="mt-md font-label-sm text-label-sm text-outline hover:text-on-surface transition-colors">
                        Already have a code? <span class="text-secondary underline underline-offset-4 decoration-secondary/30">Join existing home</span>
</button>
</div>
</div>
</div>
<!-- Decorative UI Elements -->
<div class="mt-xl grid grid-cols-3 gap-md opacity-40">
<div class="h-[2px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<div class="h-[2px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<div class="h-[2px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
</div>
</main>
<!-- Illustrative Image Background (Bottom Corner) -->
<div class="fixed bottom-0 right-0 w-1/3 aspect-square pointer-events-none select-none overflow-hidden opacity-30 mix-blend-screen">
